name: Release

# Publishes nothing: Packagist picks a tag up by itself, through its GitHub
# webhook. This checks that the tag names a commit of main and a version that
# CHANGELOG.md describes, so a mistaken tag shows as a failed run on it, and
# writes that version's section to the run's summary, for the release notes.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag a commit of main."; exit 1; }

      - name: Check CHANGELOG.md describes the version
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z (Semantic Versioning)."
            exit 1
          fi

          # The section's lines, from its heading to the next version's.
          section=$(awk -v heading="## [$version] - " '
            index($0, "## [") == 1 { inside = (index($0, heading) == 1) }
            inside { print }
          ' CHANGELOG.md)

          if [ -z "$section" ]; then
            echo "::error file=CHANGELOG.md::No \"## [$version] - YYYY-MM-DD\" section. Move the [Unreleased] entries under it, on main, then tag that commit."
            exit 1
          fi

          if ! grep -qE "^## \[[^]]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" <<< "$(head -n 1 <<< "$section")"; then
            echo "::error file=CHANGELOG.md::The $version heading has no YYYY-MM-DD date."
            exit 1
          fi

          if ! tail -n +2 <<< "$section" | grep -q '[^[:space:]]'; then
            echo "::error file=CHANGELOG.md::The $version section is empty."
            exit 1
          fi

          echo "$section" >> "$GITHUB_STEP_SUMMARY"
