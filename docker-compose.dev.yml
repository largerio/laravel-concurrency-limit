# Every container runs as a non-root user, without capabilities or privilege
# escalation, on a read-only root filesystem, and publishes no port.
x-hardened: &hardened
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true

services:
  app:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    image: laravel-concurrency-limit-dev:php${PHP_VERSION:-8.5}
    # The Makefile exports the host uid/gid so vendor/ and caches written
    # through the bind mount belong to the developer, not root.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    # Forwards Ctrl-C to PHP and reaps the integration suite's worker processes.
    init: true
    volumes:
      - .:/app
      - composer-cache:/composer/cache
    tmpfs:
      - /tmp
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    networks:
      # Packagist, for Composer.
      - default
      - stores
    depends_on:
      redis:
        condition: service_healthy
      memcached:
        condition: service_healthy

  redis:
    <<: *hardened
    image: redis:8.10.3-alpine3.23@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    user: redis
    # Throwaway store: no RDB snapshot, no append-only file.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - stores
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      start_interval: 1s

  memcached:
    <<: *hardened
    image: memcached:1.6.45-alpine3.24@sha256:084fb554292d1447bc2c68b80c2331b98834514f56c866bc21a61be3c2ee376d
    networks:
      - stores
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      start_interval: 1s

  # Only started by `make secrets`; reads the repository, needs no network.
  gitleaks:
    <<: *hardened
    image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    profiles:
      - tools
    network_mode: none
    tmpfs:
      - /tmp
    volumes:
      - .:/repo:ro
    working_dir: /repo

networks:
  # The stores have no route to the outside world.
  stores:
    internal: true

volumes:
  composer-cache:
