<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="title desc">
  <title id="title">How slots work</title>
  <desc id="desc">A pool of two slots. Requests A and B each take a free slot. Request C finds both taken and is rejected immediately with a 429. When A's response is sent its slot is released and request D takes it. B's process is killed, so nothing releases its slot: the slot frees itself when its TTL runs out.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .slot { fill: #f6f8fa; stroke: #d0d7de; }
    .track { fill: #d0d7de; }
    .ttl { fill: #0969da; }
    .req { fill: #ddf4ff; stroke: #0969da; }
    .bad { fill: #ffebe9; stroke: #cf222e; }
    .red { fill: #cf222e; }
    .ok { fill: #dafbe1; stroke: #1a7f37; }
    .green { fill: #1a7f37; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; }
    .title { font-size: 14px; }
    .small { font-size: 11px; }
    .badge { font-size: 11px; font-weight: 600; }
    .caption { font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .slot { fill: #151b23; stroke: #30363d; }
      .track { fill: #30363d; }
      .ttl { fill: #4493f8; }
      .req { fill: #121d2f; stroke: #4493f8; }
      .bad { fill: #2d1214; stroke: #f85149; }
      .red { fill: #f85149; }
      .ok { fill: #12261e; stroke: #3fb950; }
      .green { fill: #3fb950; }
    }

    /*
     * One 20 s loop: 1% is 0.2 s. Without animation (prefers-reduced-motion),
     * the base styles show the moment request C is rejected.
     */
    .anim { animation-duration: 20s; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar { transform-box: fill-box; transform-origin: 0 50%; }

    .a { transform: translate(380px, 80px); animation-name: a; }
    .a-ok { opacity: 0; animation-name: a-ok; }
    .b { transform: translate(380px, 170px); animation-name: b; }
    .c { transform: translate(210px, 125px); animation-name: c; }
    .c-bad { animation-name: c-bad; }
    .d { transform: translate(380px, 80px); opacity: 0; animation-name: d; }
    .ttl-a { transform: scaleX(.7); animation-name: ttl-a; }
    .ttl-d { opacity: 0; animation-name: ttl-d; }
    .ttl-b { transform: scaleX(.75); animation-name: ttl-b; }
    .killed { opacity: 0; animation-name: killed; }
    .expired { opacity: 0; animation-name: expired; }
    .cap1 { opacity: 0; animation-name: cap1; }
    .cap2 { animation-name: cap2; }
    .cap3 { opacity: 0; animation-name: cap3; }
    .cap4 { opacity: 0; animation-name: cap4; }
    .cap5 { opacity: 0; animation-name: cap5; }

    @keyframes a {
      0% { transform: translate(60px, 80px); opacity: 0; animation-timing-function: ease-out; }
      1% { opacity: 1; }
      5%, 33% { transform: translate(380px, 80px); opacity: 1; }
      33% { animation-timing-function: ease-in-out; }
      37%, 41% { transform: translate(680px, 80px); opacity: 1; }
      44%, 100% { transform: translate(680px, 80px); opacity: 0; }
    }
    @keyframes a-ok {
      0%, 35% { opacity: 0; }
      37%, 100% { opacity: 1; }
    }
    @keyframes b {
      0%, 6% { transform: translate(60px, 170px); opacity: 0; animation-timing-function: ease-out; }
      7% { opacity: 1; }
      11%, 100% { transform: translate(380px, 170px); }
      48% { opacity: 1; }
      49%, 68% { opacity: .35; }
      70%, 100% { opacity: 0; }
    }
    @keyframes c {
      0%, 17% { transform: translate(60px, 125px); opacity: 0; animation-timing-function: ease-out; }
      18% { opacity: 1; }
      22%, 28% { transform: translate(210px, 125px); opacity: 1; }
      28% { animation-timing-function: ease-in; }
      31%, 100% { transform: translate(150px, 125px); opacity: 0; }
    }
    @keyframes c-bad {
      0%, 21.9% { opacity: 0; }
      22%, 100% { opacity: 1; }
    }
    @keyframes d {
      0%, 38% { transform: translate(60px, 80px); opacity: 0; animation-timing-function: ease-out; }
      39% { opacity: 1; }
      43%, 100% { transform: translate(380px, 80px); }
      88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }
    @keyframes ttl-a {
      0%, 4.9% { transform: scaleX(1); opacity: 0; }
      5% { transform: scaleX(1); opacity: 1; }
      33% { transform: scaleX(.51); opacity: 1; }
      33.1%, 100% { transform: scaleX(.51); opacity: 0; }
    }
    @keyframes ttl-d {
      0%, 42.9% { transform: scaleX(1); opacity: 0; }
      43% { transform: scaleX(1); opacity: 1; }
      88% { transform: scaleX(.21); opacity: 1; }
      92%, 100% { transform: scaleX(.21); opacity: 0; }
    }
    @keyframes ttl-b {
      0%, 10.9% { transform: scaleX(1); opacity: 0; }
      11% { transform: scaleX(1); opacity: 1; }
      68%, 100% { transform: scaleX(0); opacity: 1; }
    }
    @keyframes killed {
      0%, 47.9% { opacity: 0; }
      48%, 67.9% { opacity: 1; }
      68%, 100% { opacity: 0; }
    }
    @keyframes expired {
      0%, 67.9% { opacity: 0; }
      68%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }
    @keyframes cap1 {
      0% { opacity: 0; }
      2%, 15% { opacity: 1; }
      16.5%, 100% { opacity: 0; }
    }
    @keyframes cap2 {
      0%, 17% { opacity: 0; }
      18.5%, 30% { opacity: 1; }
      31.5%, 100% { opacity: 0; }
    }
    @keyframes cap3 {
      0%, 32% { opacity: 0; }
      33.5%, 45.5% { opacity: 1; }
      47%, 100% { opacity: 0; }
    }
    @keyframes cap4 {
      0%, 47.5% { opacity: 0; }
      49%, 66% { opacity: 1; }
      67.5%, 100% { opacity: 0; }
    }
    @keyframes cap5 {
      0%, 68% { opacity: 0; }
      69.5%, 88% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none; }
    }
  </style>

  <rect class="bg" x=".5" y=".5" width="879" height="299" rx="8"/>

  <text x="24" y="32"><tspan class="code text">Slots::max(2)</tspan><tspan class="title muted" dx="10">one pool per key, one cache lock per slot, one TTL per lock</tspan></text>

  <text class="muted small" x="60" y="62">requests</text>
  <text class="muted small" x="360" y="62">pool</text>
  <text class="muted small" x="680" y="62">responses</text>

  <!-- Slot 1 -->
  <rect class="slot" x="360.5" y="70.5" width="159" height="63" rx="6"/>
  <text class="muted small" x="536" y="98">slot 1</text>
  <rect class="track" x="372" y="122" width="136" height="4" rx="2"/>
  <rect class="ttl bar anim ttl-a" x="372" y="122" width="136" height="4" rx="2"/>
  <rect class="ttl bar anim ttl-d" x="372" y="122" width="136" height="4" rx="2"/>

  <!-- Slot 2 -->
  <rect class="slot" x="360.5" y="160.5" width="159" height="63" rx="6"/>
  <text class="muted small" x="536" y="188">slot 2</text>
  <rect class="track" x="372" y="212" width="136" height="4" rx="2"/>
  <rect class="ttl bar anim ttl-b" x="372" y="212" width="136" height="4" rx="2"/>
  <text class="red small anim killed" x="536" y="204">process killed, slot still held</text>
  <text class="muted small anim expired" x="536" y="204">TTL ran out: slot free</text>

  <!-- Request A: takes slot 1, then answers 200 -->
  <g class="anim a">
    <rect class="req" x=".5" y=".5" width="119" height="31" rx="15.5"/>
    <text class="text" x="60" y="20" text-anchor="middle">request A</text>
    <g class="anim a-ok">
      <rect class="ok" x="128.5" y="6.5" width="39" height="19" rx="9.5"/>
      <text class="green badge" x="148" y="20" text-anchor="middle">200</text>
    </g>
  </g>

  <!-- Request B: takes slot 2, then its process is killed -->
  <g class="anim b">
    <rect class="req" x=".5" y=".5" width="119" height="31" rx="15.5"/>
    <text class="text" x="60" y="20" text-anchor="middle">request B</text>
  </g>

  <!-- Request C: no free slot, rejected -->
  <g class="anim c">
    <rect class="req" x=".5" y=".5" width="119" height="31" rx="15.5"/>
    <g class="anim c-bad">
      <rect class="bad" x=".5" y=".5" width="119" height="31" rx="15.5"/>
      <rect class="bad" x="-47.5" y="6.5" width="39" height="19" rx="9.5"/>
      <text class="red badge" x="-28" y="20" text-anchor="middle">429</text>
    </g>
    <text class="text" x="60" y="20" text-anchor="middle">request C</text>
  </g>

  <!-- Request D: takes the slot A released -->
  <g class="anim d">
    <rect class="req" x=".5" y=".5" width="119" height="31" rx="15.5"/>
    <text class="text" x="60" y="20" text-anchor="middle">request D</text>
  </g>

  <g class="text caption" text-anchor="middle">
    <text class="anim cap1" x="440" y="268">A and B each take a free slot.</text>
    <text class="anim cap2" x="440" y="268">C finds both slots taken: rejected immediately with a 429.</text>
    <text class="anim cap3" x="440" y="268">A's response is sent, its slot is released, and D takes it.</text>
    <text class="anim cap4" x="440" y="268">B's process is killed. Nothing releases its slot…</text>
    <text class="anim cap5" x="440" y="268">…so it frees itself when its TTL runs out. No cleanup needed.</text>
  </g>
</svg>
