<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Waiting for a slot</title>
  <desc id="desc">A pool of two slots whose limit waits up to two seconds. Requests A and B each take a free slot. Request C finds both taken and waits, polling for a free slot. When A's response is sent, C takes the freed slot. Request D waits too, but B and C are still running: no slot frees within two seconds, and D is rejected with a 429.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .slot { fill: #f6f8fa; stroke: #d0d7de; }
    .track { fill: #d0d7de; }
    .ttl { fill: #0969da; }
    .req { fill: #ddf4ff; stroke: #0969da; }
    .wait { fill: #fff8c5; stroke: #9a6700; }
    .amber { fill: #9a6700; }
    .bad { fill: #ffebe9; stroke: #cf222e; }
    .red { fill: #cf222e; }
    .ok { fill: #dafbe1; stroke: #1a7f37; }
    .green { fill: #1a7f37; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; }
    .title { font-size: 14px; }
    .small { font-size: 11px; }
    .badge { font-size: 11px; font-weight: 600; }
    .caption { font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .slot { fill: #151b23; stroke: #30363d; }
      .track { fill: #30363d; }
      .ttl { fill: #4493f8; }
      .req { fill: #121d2f; stroke: #4493f8; }
      .wait { fill: #272115; stroke: #d29922; }
      .amber { fill: #d29922; }
      .bad { fill: #2d1214; stroke: #f85149; }
      .red { fill: #f85149; }
      .ok { fill: #12261e; stroke: #3fb950; }
      .green { fill: #3fb950; }
    }

    /*
     * One 20 s loop: 1% is 0.2 s. Without animation (prefers-reduced-motion),
     * the base styles show the moment request C is waiting.
     */
    .anim { animation-duration: 20s; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar { transform-box: fill-box; transform-origin: 0 50%; }

    .a { transform: translate(380px, 80px); animation-name: a; }
    .a-ok { opacity: 0; animation-name: a-ok; }
    .b { transform: translate(380px, 170px); animation-name: b; }
    .c { transform: translate(210px, 125px); animation-name: c; }
    .c-wait { animation-name: c-wait; }
    .c-budget { transform: scaleX(.6); animation-name: c-budget; }
    .d { transform: translate(210px, 125px); opacity: 0; animation-name: d; }
    .d-wait { animation-name: d-wait; }
    .d-budget { animation-name: d-budget; }
    .d-bad { opacity: 0; animation-name: d-bad; }
    .ttl-a { transform: scaleX(.85); animation-name: ttl-a; }
    .ttl-c { opacity: 0; animation-name: ttl-c; }
    .ttl-b { transform: scaleX(.9); animation-name: ttl-b; }
    .cap1 { opacity: 0; animation-name: cap1; }
    .cap2 { animation-name: cap2; }
    .cap3 { opacity: 0; animation-name: cap3; }
    .cap4 { opacity: 0; animation-name: cap4; }
    .cap5 { opacity: 0; animation-name: cap5; }

    @keyframes a {
      0% { transform: translate(60px, 80px); opacity: 0; animation-timing-function: ease-out; }
      1% { opacity: 1; }
      5%, 33% { transform: translate(380px, 80px); opacity: 1; }
      33% { animation-timing-function: ease-in-out; }
      37%, 41% { transform: translate(680px, 80px); opacity: 1; }
      44%, 100% { transform: translate(680px, 80px); opacity: 0; }
    }
    @keyframes a-ok {
      0%, 35% { opacity: 0; }
      37%, 100% { opacity: 1; }
    }
    @keyframes b {
      0%, 6% { transform: translate(60px, 170px); opacity: 0; animation-timing-function: ease-out; }
      7% { opacity: 1; }
      11%, 100% { transform: translate(380px, 170px); }
      90% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }
    @keyframes c {
      0%, 17% { transform: translate(60px, 125px); opacity: 0; animation-timing-function: ease-out; }
      18% { opacity: 1; }
      22%, 38% { transform: translate(210px, 125px); }
      38% { animation-timing-function: ease-in-out; }
      42%, 100% { transform: translate(380px, 80px); }
      90% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }
    @keyframes c-wait {
      0%, 21.9% { opacity: 0; }
      22%, 38% { opacity: 1; }
      38.1%, 100% { opacity: 0; }
    }
    @keyframes c-budget {
      0%, 22% { transform: scaleX(1); }
      38%, 100% { transform: scaleX(.33); }
    }
    @keyframes d {
      0%, 50% { transform: translate(60px, 125px); opacity: 0; animation-timing-function: ease-out; }
      51% { opacity: 1; }
      55%, 85% { transform: translate(210px, 125px); opacity: 1; }
      85% { animation-timing-function: ease-in; }
      88%, 100% { transform: translate(150px, 125px); opacity: 0; }
    }
    @keyframes d-wait {
      0%, 54.9% { opacity: 0; }
      55%, 78.9% { opacity: 1; }
      79%, 100% { opacity: 0; }
    }
    @keyframes d-budget {
      0%, 55% { transform: scaleX(1); }
      79%, 100% { transform: scaleX(0); }
    }
    @keyframes d-bad {
      0%, 78.9% { opacity: 0; }
      79%, 100% { opacity: 1; }
    }
    @keyframes ttl-a {
      0%, 4.9% { transform: scaleX(1); opacity: 0; }
      5% { transform: scaleX(1); opacity: 1; }
      33% { transform: scaleX(.72); opacity: 1; }
      33.1%, 100% { transform: scaleX(.72); opacity: 0; }
    }
    @keyframes ttl-c {
      0%, 41.9% { transform: scaleX(1); opacity: 0; }
      42% { transform: scaleX(1); opacity: 1; }
      90% { transform: scaleX(.52); opacity: 1; }
      94%, 100% { transform: scaleX(.52); opacity: 0; }
    }
    @keyframes ttl-b {
      0%, 10.9% { transform: scaleX(1); opacity: 0; }
      11% { transform: scaleX(1); opacity: 1; }
      90% { transform: scaleX(.21); opacity: 1; }
      94%, 100% { transform: scaleX(.21); opacity: 0; }
    }
    @keyframes cap1 {
      0% { opacity: 0; }
      2%, 15% { opacity: 1; }
      16.5%, 100% { opacity: 0; }
    }
    @keyframes cap2 {
      0%, 17% { opacity: 0; }
      18.5%, 31% { opacity: 1; }
      32.5%, 100% { opacity: 0; }
    }
    @keyframes cap3 {
      0%, 33% { opacity: 0; }
      34.5%, 47.5% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @keyframes cap4 {
      0%, 50% { opacity: 0; }
      51.5%, 77% { opacity: 1; }
      78.5%, 100% { opacity: 0; }
    }
    @keyframes cap5 {
      0%, 79% { opacity: 0; }
      80.5%, 90% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none; }
    }
  </style>

  <rect class="bg" x=".5" y=".5" width="879" height="299" rx="8"/>

  <text x="24" y="32"><tspan class="code text">Slots::max(2)->block(2)</tspan><tspan class="title muted" dx="10">wait up to 2 seconds for a slot before rejecting</tspan></text>

  <text class="muted small" x="60" y="62">requests</text>
  <text class="muted small" x="360" y="62">pool</text>
  <text class="muted small" x="680" y="62">responses</text>

  <!-- Slot 1 -->
  <rect class="slot" x="360.5" y="70.5" width="159" height="63" rx="6"/>
  <text class="muted small" x="536" y="98">slot 1</text>
  <rect class="track" x="372" y="122" width="136" height="4" rx="2"/>
  <rect class="ttl bar anim ttl-a" x="372" y="122" width="136" height="4" rx="2"/>
  <rect class="ttl bar anim ttl-c" x="372" y="122" width="136" height="4" rx="2"/>

  <!-- Slot 2 -->
  <rect class="slot" x="360.5" y="160.5" width="159" height="63" rx="6"/>
  <text class="muted small" x="536" y="188">slot 2</text>
  <rect class="track" x="372" y="212" width="136" height="4" rx="2"/>
  <rect class="ttl bar anim ttl-b" x="372" y="212" width="136" height="4" rx="2"/>

  <!-- Request A: takes slot 1, then answers 200 -->
  <g class="anim a">
    <rect class="req" x=".5" y=".5" width="119" height="31" rx="15.5"/>
    <text class="text" x="60" y="20" text-anchor="middle">request A</text>
    <g class="anim a-ok">
      <rect class="ok" x="128.5" y="6.5" width="39" height="19" rx="9.5"/>
      <text class="green badge" x="148" y="20" text-anchor="middle">200</text>
    </g>
  </g>

  <!-- Request B: takes slot 2 and keeps it -->
  <g class="anim b">
    <rect class="req" x=".5" y=".5" width="119" height="31" rx="15.5"/>
    <text class="text" x="60" y="20" text-anchor="middle">request B</text>
  </g>

  <!-- Request C: waits, then takes the slot A released -->
  <g class="anim c">
    <rect class="req" x=".5" y=".5" width="119" height="31" rx="15.5"/>
    <g class="anim c-wait">
      <rect class="wait" x=".5" y=".5" width="119" height="31" rx="15.5"/>
      <rect class="wait" x="-63.5" y="6.5" width="55" height="19" rx="9.5"/>
      <text class="amber badge" x="-36" y="20" text-anchor="middle">waiting</text>
      <rect class="track" x="12" y="38" width="96" height="3" rx="1.5"/>
      <rect class="amber bar anim c-budget" x="12" y="38" width="96" height="3" rx="1.5"/>
    </g>
    <text class="text" x="60" y="20" text-anchor="middle">request C</text>
  </g>

  <!-- Request D: waits until its time is up, then is rejected -->
  <g class="anim d">
    <rect class="req" x=".5" y=".5" width="119" height="31" rx="15.5"/>
    <g class="anim d-wait">
      <rect class="wait" x=".5" y=".5" width="119" height="31" rx="15.5"/>
      <rect class="wait" x="-63.5" y="6.5" width="55" height="19" rx="9.5"/>
      <text class="amber badge" x="-36" y="20" text-anchor="middle">waiting</text>
      <rect class="track" x="12" y="38" width="96" height="3" rx="1.5"/>
      <rect class="amber bar anim d-budget" x="12" y="38" width="96" height="3" rx="1.5"/>
    </g>
    <g class="anim d-bad">
      <rect class="bad" x=".5" y=".5" width="119" height="31" rx="15.5"/>
      <rect class="bad" x="-47.5" y="6.5" width="39" height="19" rx="9.5"/>
      <text class="red badge" x="-28" y="20" text-anchor="middle">429</text>
    </g>
    <text class="text" x="60" y="20" text-anchor="middle">request D</text>
  </g>

  <g class="text caption" text-anchor="middle">
    <text class="anim cap1" x="440" y="268">A and B each take a free slot.</text>
    <text class="anim cap2" x="440" y="268">C finds both slots taken. It waits, and polls for a free slot.</text>
    <text class="anim cap3" x="440" y="268">A's response is sent: C takes the freed slot on its next poll.</text>
    <text class="anim cap4" x="440" y="268">D waits too, but B and C are still running…</text>
    <text class="anim cap5" x="440" y="268">…and no slot frees within 2 seconds: 429.</text>
  </g>
</svg>
